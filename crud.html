<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전화번호부</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: rgb(181, 222, 235);
            padding: 20px 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            width: 70px;
        }

        form {
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: #a6cef5;
        }

        input,
        select {
            margin: 5px;
            padding: 7px;
            border: 1px solid black;
            border-radius: 5px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: lightblue;
            background-color: rgb(236, 234, 234);
        }

        button {
            padding: 7px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: rgb(65, 65, 240);
            color: white;
        }

        button:hover {
            background-color: #2f5fa7;
        }

        table {
            text-align: center;
        }

        th {
            padding: 10px;
            background-color: #faf4bb;
            border: 1px solid black;
        }

        td {
            padding: 10px;
            border: 1px solid black;
        }

        tbody tr:hover {
            background-color: rgb(148, 215, 238);
        }

        th:last-child {
            background-color: rgb(181, 222, 235);
            border: none;
        }

        .button-cell {
            border: none;
        }

        td>button:first-child {
            background-color: #38bd7f;
        }

        td>button:first-child:hover {
            background-color: #259963;
        }

        td>button:last-child {
            background-color: rgb(223, 119, 119);
        }

        td>button:last-child:hover {
            background-color: rgb(192, 89, 89);
        }
    </style>
</head>

<body>
    <h1>전화번호부</h1>

    <form id="phoneBookForm">
        <label for="name">이름</label>
        <input type="text" id="name" required><br>

        <label for="job">직업</label>
        <input type="text" id="job" required><br>

        <label for="address">주소</label>
        <input type="text" id="address" required><br>

        <label for="phone">전화번호</label>
        <input type="tel" id="phone" required><br>

        <label for="gender">성별</label>
        <select id="gender">
            <option value="" selected>선택</option>
            <option value="male">남성</option>
            <option value="female">여성</option>
        </select><br>

        <button type="submit">등록</button>
    </form>

    <hr>
    
    <div>
        <input type="text" id="searchInput" placeholder="이름을 검색하세요">
        <button type="button" onclick="searchContacts()">검색</button>
        <button type="button" onclick="resetSearch()">초기화</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>이름</th>
                <th>직업</th>
                <th>주소</th>
                <th>전화번호</th>
                <th>성별</th>
                <th></th>
            </tr>
        </thead>

        <tbody id="contactList">
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        //mockAPI 주소
        const API_URL = "https://6ae2c65dbbb54129229a6203.mockapi.io/contact";

        let contacts = [];

        //CREATE
        async function createContact(contact) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(contact)
                });

                if (!response.ok) throw new Error(`HTTPS${response.status}`);

                const data = await response.json();

                await getContacts();
            } catch (error) {
                alert("연락처를 불러오는 중 오류가 발생하였습니다.");
            }
        }

        //READ
        async function getContacts() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP${response.status}`);

                const data = await response.json();

                contacts = data;

                renderContacts();
            } catch (error) {
                alert("연락처를 불러오는 중 오류가 발생하였습니다.");
            }
        }

        // UPDATE
        let editIndex = null;

        //선택한 데이터 form에 불러오기
        function editContact(id) {
            const contact = contacts.find(function (contact) {
                return String(contact.id) === String(id);
            });

            editIndex = id;

            document.getElementById("name").value = contact.name;
            document.getElementById("job").value = contact.job;
            document.getElementById("address").value = contact.address;
            document.getElementById("phone").value = contact.phone;
            document.getElementById("gender").value = contact.gender;
        }

        //수정된 데이터 서버에 전송하기
        async function updateContact(id, contact) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(contact)
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                await getContacts();
            } catch (error) {
                alert("연락처를 수정하는 중 오류가 발생했습니다.");
            }
        }

        // DELETE
        async function deleteContact(id) {
            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                await getContacts();
            } catch (error) {
                alert("연락처를 삭제하는 중 오류가 발생했습니다.");
            }
        }

        //검색
        function searchContacts(){
            const searchInput = document.getElementById("searchInput").value.trim();

            const result = contacts.filter(function (contact){
                return contact.name.includes(searchInput);
            });

            renderContacts(result);
        }

        //검색 초기화
        function resetSearch(){
            document.querySelector("#searchInput").value = "";
            renderContacts();
        }
        
        // 화면 갱신 함수
        function renderContacts(displayContacts = contacts) {
            const contactList = document.querySelector("#contactList");

            contactList.innerHTML = "";

            displayContacts.forEach(function (contact) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${contact.id}</td>
                    <td>${contact.name}</td>
                    <td>${contact.job}</td>
                    <td>${contact.address}</td>
                    <td>${contact.phone}</td>
                    <td>${contact.gender === "male" ? "남성" : "여성"}</td>
                    <td class="button-cell">
                        <button onclick="editContact(${contact.id})">수정</button>
                        <button onclick="deleteContact(${contact.id})">삭제</button>
                    </td>
                `;

                contactList.appendChild(row);
            });
        }

        // Validation 함수
        function validate(contact) {
            if (contact.name.length < 2 || contact.name.length > 20) {
                alert("이름은 2~20글자 사이로 입력해주세요.");
                document.getElementById("name").focus();
                return false;
            }

            if (contact.job.length < 2 || contact.job.length > 30) {
                alert("직업은 2~30글자 사이로 입력해주세요.");
                document.getElementById("job").focus();
                return false;
            }

            if (contact.gender === "") {
                alert("성별을 선택해주세요.");
                document.getElementById("gender").focus();
                return false;
            }

            return true;
        }

        // 등록 버튼 클릭 시
        document.getElementById("phoneBookForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const job = document.getElementById("job").value.trim();
            const address = document.getElementById("address").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const gender = document.getElementById("gender").value;

            // 연락처 객체 생성
            const contact = {
                name: name,
                job: job,
                address: address,
                phone: phone,
                gender: gender
            };

            // Validation 통과 시 등록
            if (validate(contact)) {
                if (editIndex === null) {
                    await createContact(contact);
                } else {
                    // 기존 연락처 수정
                    await updateContact(editIndex, contact);
                    editIndex = null;
                }

                renderContacts();
                document.querySelector("#phoneBookForm").reset();
            }
        });

        // 초기 화면 생성
        getContacts();
    </script>
</body>

</html>
